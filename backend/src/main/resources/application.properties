spring.application.name=diplomski

# Optional ignored local environment file; deployments should provide the same keys as environment variables.
spring.config.import=optional:file:.env.properties,optional:file:backend/.env.properties

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

server.port=8081

# The authoritative database is validated only. Spring never creates, updates, or initializes its schema.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never

# Autonomous AI lifecycle. Scheduling can be disabled for tests or maintenance.
ai.lifecycle.scheduling.enabled=${AI_SCHEDULING_ENABLED:true}
ai.lifecycle.capture-delay-ms=${AI_CAPTURE_DELAY_MS:60000}
ai.lifecycle.lock-lease=${AI_LOCK_LEASE:PT1H}
ai.lifecycle.max-retries=${AI_MAX_RETRIES:3}
app.ai.assessment.cron=${AI_ASSESSMENT_CRON:0 15 2 * * *}
app.ai.training.cron=${AI_TRAINING_CRON:0 0 3 * * SUN}
app.ai.time-zone=${AI_TIME_ZONE:Europe/Belgrade}
app.ai.audit.path=${AI_AUDIT_LOG_PATH:logs/ai}

# JWT signing material is required from the environment or ignored local environment file.
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=${JWT_EXPIRATION:PT1H}
security.jwt.issuer=${JWT_ISSUER:sena-spirits-backend}
security.jwt.audience=${JWT_AUDIENCE:sena-spirits-web}
security.login-rate-limit.window=${LOGIN_RATE_LIMIT_WINDOW:PT15M}
security.login-rate-limit.max-attempts-per-ip=${LOGIN_RATE_LIMIT_MAX_ATTEMPTS_PER_IP:50}
security.login-rate-limit.max-attempts-per-identity=${LOGIN_RATE_LIMIT_MAX_ATTEMPTS_PER_IDENTITY:10}
security.login-rate-limit.max-buckets=${LOGIN_RATE_LIMIT_MAX_BUCKETS:10000}

spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB

# SMTP settings are supplied by the deployment environment.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM}
